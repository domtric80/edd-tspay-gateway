name: edd-tspay

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:6.8.2-php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/wp-content/plugins/easy-digital-downloads:/var/www/html/wp-content/plugins/easy-digital-downloads:ro
      - ./plugin/edd-tspay:/var/www/html/wp-content/plugins/edd-tspay:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/wp-login.php >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    user: "33:33"
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/wp-content/plugins/easy-digital-downloads:/var/www/html/wp-content/plugins/easy-digital-downloads:ro
      - ./plugin/edd-tspay:/var/www/html/wp-content/plugins/edd-tspay:ro
      - ./:/workspace:ro

  tspay-mock:
    image: php:8.2-cli
    restart: unless-stopped
    command: ["php", "-S", "0.0.0.0:8080", "/app/router.php"]
    ports:
      - "8090:8080"
    environment:
      MOCK_PUBLIC_URL: http://localhost:8090
      MOCK_API_KEY: mock-api-key
      MOCK_MERCHANT_REF: MOCKMERCHANT
    volumes:
      - ./mock-tspay:/app:ro
      - tspay_mock_data:/data

volumes:
  db_data:
  wordpress_data:
  tspay_mock_data:

